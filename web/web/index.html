<body style="background-color: #F7F3EA; margin: 0;">
  <script>
    (function() {
      var VERSION = '20261019c';
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
          });
        }
        if ('caches' in window && localStorage.getItem('kachava_sw_ver') !== VERSION) {
          caches.keys().then(function(names) {
            return Promise.all(names.map(function(n) { return caches.delete(n); }));
          }).then(function() {
            localStorage.setItem('kachava_sw_ver', VERSION);
            window.location.reload();
          });
        }
      } catch (e) {}
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261019c" async></script>
</body>
