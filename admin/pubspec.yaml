name: kachava_admin_dashboard
description: Kachava Lux Administrative & Concierge Operations Dashboard (Flutter Web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    # Admin UI font (OFL, see assets/fonts/Roboto-OFL.txt). Variable wght axis.
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-VariableFont.ttf
