name: kachava_guest_portal
description: Kachava Lux guest portal (Flutter Web PWA).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Zen Kaku Gothic New
      fonts:
        - asset: assets/fonts/ZenKakuGothicNew-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenKakuGothicNew-Medium.ttf
          weight: 500
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-VariableFont_wght.ttf
