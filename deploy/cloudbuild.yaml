steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend-image'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend-image'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-cloud-run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--min-instances=0'
      - '--max-instances=2'
      - '--concurrency=80'
      - '--cpu-throttling'
      - '--update-env-vars=^|^NODE_ENV=production|USE_FIRESTORE=true|FIREBASE_PROJECT_ID=$PROJECT_ID|FIRESTORE_DATABASE_ID=${_FIRESTORE_DB}|FIREBASE_STORAGE_BUCKET=${_STORAGE_BUCKET}|GUEST_PORTAL_URL=${_GUEST_PORTAL_URL}|ADMIN_PORTAL_URL=${_ADMIN_PORTAL_URL}|ADMIN_SERVICE_EMAIL=${_ADMIN_SERVICE_EMAIL}|CORS_ALLOWED_ORIGINS=${_GUEST_PORTAL_URL},${_ADMIN_PORTAL_URL}'
      - '--update-secrets=STAFF_JWT_SECRET=${_JWT_SECRET_NAME}:latest,REALTIME_ADMIN_CHANNEL=${_REALTIME_SECRET_NAME}:latest'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:$BUILD_ID'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE_NAME}:latest'

substitutions:
  _REGION: 'us-central1'
  _AR_REPO: 'cloud-run-source-deploy'
  _SERVICE_NAME: 'kachava-backend'
  _FIRESTORE_DB: 'kavacha-db'
  _STORAGE_BUCKET: 'kavacha-store'
  _GUEST_PORTAL_URL: 'https://kavacha-app-guest-portal.web.app'
  _ADMIN_PORTAL_URL: 'https://kavacha-app-admin-dashboard.web.app'
  _ADMIN_SERVICE_EMAIL: ''
  _JWT_SECRET_NAME: 'kachava-staff-jwt-secret'
  _REALTIME_SECRET_NAME: 'kachava-realtime-admin-channel'

options:
  logging: CLOUD_LOGGING_ONLY
